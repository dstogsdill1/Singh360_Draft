        - paragraph [ref=e70]: Singh360 is a software & services company focused on driving energy savings for multi-site building owners. We specialize in building management systems (BMS), energy efficiency, utility data analytics, and system optimization for buildings. Our solutions reflect the latest innovative technologies. From building envelope assessments to a complete mechanical and electrical design, and renewable energy evaluations for both new and existing buildings. Our range of new and existing building commissioning experience allows us to engineer solutions in a cost effective and efficient manner tailored to the needs of Facility Managers.
