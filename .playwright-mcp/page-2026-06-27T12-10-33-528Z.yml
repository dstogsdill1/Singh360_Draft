          - paragraph [ref=e97]: At Singh360, we support you in making decisions based on fact, science and great engineering. We deploy computer modeling tools and our custom developed HVAC and refrigeration modeling tools. These models include real-time pricing, time of use rates, and fixed energy rate structures. We not only help client’s engineer efficient building but also design processes, train people, and deploy appropriate tools to hold on to the energy savings for the long term.
