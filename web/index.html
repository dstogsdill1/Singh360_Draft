<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Singh360 Draft — CAD WYSIWYG Editor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #2d2d2d;
      color: #000;
    }

    /* ── APP SHELL ── */
    #app {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    /* ── SIDEBAR (300px checklist) ── */
    #sidebar {
      width: 300px;
      flex-shrink: 0;
      background: #e8e8e8;
      border-right: 2px solid #000;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-head {
      padding: 16px;
      border-bottom: 1px solid #999;
      background: #ddd;
    }
    .sidebar-head h1 {
      font-size: 14px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 12px;
    }
    .modular-link {
      display: block;
      margin-top: 8px;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      color: #0b3d91;
      text-decoration: none;
    }
    .sidebar-head input[type=file] { display: none; }
    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      border: 2px solid #000;
      background: #fff;
      cursor: pointer;
      border-radius: 0;
    }
    .btn:hover { background: #f0f0f0; }
    #checklist {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }
    .check-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 8px 16px;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      border-bottom: 1px solid #ccc;
    }
    .check-item:hover { background: #d8d8d8; }
    .check-item.active { background: #c0c0c0; }
    .check-item input { width: 14px; height: 14px; margin-top: 2px; flex-shrink: 0; cursor: pointer; }
    .check-item span { word-break: break-word; line-height: 1.3; }
    .sidebar-meta {
      padding: 12px 16px;
      border-top: 1px solid #999;
      font-size: 11px;
    }
    .sidebar-meta label {
      display: block;
      font-size: 8px;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 2px;
      margin-top: 8px;
    }
    .sidebar-meta input {
      width: 100%;
      padding: 6px;
      border: 1px solid #000;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      border-radius: 0;
    }
    #status-line {
      padding: 8px 16px;
      font-size: 10px;
      font-weight: bold;
      text-transform: uppercase;
      border-top: 1px solid #999;
      background: #ddd;
    }

    /* ── MAIN WORKSPACE (drafting board) ── */
    #workspace {
      flex: 1;
      background: #2d2d2d;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      padding: 32px;
    }

    /* ── 11×17 PAPER ── */
    #paper {
      width: 1632px;
      height: 1056px;
      background: #fff;
      position: relative;
      flex-shrink: 0;
      border: 4px solid #000;
      padding: 4px;
      border-radius: 0;
    }
    #paper-inner {
      width: 100%;
      height: 100%;
      border: 1px solid #000;
      position: relative;
      background: #fff;
      overflow: hidden;
      border-radius: 0;
    }
    #paper-content {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 110px;
      overflow: auto;
      padding: 20px 24px;
    }

    /* ── DATA TABLE ── */
    .sheet-table {
      border-collapse: collapse;
      width: 100%;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      color: #000;
    }
    .sheet-table td {
      border: 1px solid #000;
      padding: 4px 6px;
      vertical-align: top;
      min-width: 40px;
      min-height: 18px;
      outline: none;
      background: #fff;
    }
    .sheet-table td:focus {
      outline: 2px solid #217346;
      outline-offset: -1px;
    }

    /* ── TITLE BLOCK (110px, rigid grid) ── */
    #title-block {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 110px;
      border-top: 3px solid #000;
      display: grid;
      grid-template-columns: 15% 20% 25% 25% 15%;
      background: #fff;
      font-family: Arial, Helvetica, sans-serif;
      color: #000;
    }
    .tb-col {
      border-right: 2px solid #000;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .tb-col:last-child { border-right: none; }
    .tb-label {
      position: absolute;
      top: 2px;
      left: 4px;
      font-size: 8px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: #000;
    }
    .tb-value {
      font-weight: bold;
      text-transform: uppercase;
      color: #000;
    }

    /* Col 1 — Revisions */
    .tb-rev-head {
      font-size: 8px;
      font-weight: bold;
      text-transform: uppercase;
      text-align: center;
      border-bottom: 1px solid #000;
      padding: 2px;
      background: #e2e2e2;
      flex: 0 0 auto;
    }
    .tb-rev-grid {
      display: grid;
      grid-template-columns: 22% 28% 50%;
      flex: 1;
      font-size: 7px;
      font-weight: bold;
      text-transform: uppercase;
    }
    .tb-rev-grid span {
      border-bottom: 1px solid #000;
      border-right: 1px solid #000;
      padding: 1px 3px;
    }
    .tb-rev-grid span:nth-child(3n) { border-right: none; }

    /* Col 2 — Firm */
    .tb-firm {
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6px;
    }
    .tb-firm img {
      max-height: 40px;
      width: auto;
      object-fit: contain;
      margin-bottom: 4px;
    }
    .tb-firm-addr {
      font-size: 8px;
      font-weight: bold;
      text-transform: uppercase;
      line-height: 1.35;
    }

    /* Col 3 — Project */
    .tb-proj-field {
      flex: 1;
      border-bottom: 1px solid #000;
      display: flex;
      align-items: center;
      padding: 10px 6px 2px;
      min-height: 0;
    }
    .tb-proj-field:last-child { border-bottom: none; }
    .tb-proj-val { font-size: 11px; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Col 4 — Sheet title */
    .tb-sheet-title-col {
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4px 8px;
    }
    .tb-sheet-title-text {
      font-size: 20px;
      font-weight: bold;
      text-transform: uppercase;
      line-height: 1.1;
    }

    /* Col 5 — Sheet number */
    .tb-num-top {
      flex: 1;
      border-bottom: 1px solid #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .tb-num-big { font-size: 24px; font-weight: bold; line-height: 1; }
    .tb-num-bot {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      background: #e2e2e2;
    }

    #empty-msg {
      font-size: 14px;
      font-weight: bold;
      text-transform: uppercase;
      color: #666;
      text-align: center;
      padding: 48px;
    }

    /* Print */
    #print-root { display: none; }
    @media print {
      #app { display: none !important; }
      #print-root { display: block !important; }
      .print-page { page-break-after: always; margin: 0; }
    }
  </style>
</head>
<body>

<div id="app">
  <aside id="sidebar">
    <div class="sidebar-head">
      <h1>Singh360 Draft</h1>
      <input type="file" id="file-input" accept=".xlsx" />
      <button class="btn" id="btn-upload" type="button">Upload Workbook</button>
      <a class="modular-link" href="/app">Open Modular Editor (/app)</a>
    </div>
    <div id="checklist"></div>
    <div class="sidebar-meta">
      <label for="meta-name">Project Name</label>
      <input type="text" id="meta-name" />
      <label for="meta-location">Location</label>
      <input type="text" id="meta-location" />
      <label for="meta-date">Date</label>
      <input type="text" id="meta-date" placeholder="MM/DD/YYYY" />
    </div>
    <div id="status-line">Ready</div>
  </aside>

  <main id="workspace">
    <div id="paper">
      <div id="paper-inner">
        <div id="paper-content">
          <p id="empty-msg">Upload a workbook to begin.</p>
        </div>
        <div id="title-block"></div>
      </div>
    </div>
  </main>
</div>

<div id="print-root"></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════════════════════ */
let project = null;
let activeIndex = 0;
let saveTimer = null;

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function setStatus(msg) {
  document.getElementById('status-line').textContent = msg;
}

function pageNumber(sheetObj) {
  if (!project || !Array.isArray(project.pages)) return { num: 0, total: 0 };
  const included = project.pages.filter(p => p.included !== false);
  const total = included.length;
  const idx = included.indexOf(sheetObj);
  return { num: idx >= 0 ? idx + 1 : 0, total };
}

function deriveCode(sheetTab, index) {
  const m = String(sheetTab || '').match(/^(\d+)/);
  return m ? m[1] : String(index + 1);
}

/** Coerce one backend page entry into a safe sheet object. Returns null if unusable. */
function coercePageEntry(raw, index) {
  if (raw == null) {
    console.error('[coercePageEntry] null entry at index', index);
    return null;
  }
  /* Legacy: pages array was sometimes a bare list of tab name strings */
  if (typeof raw === 'string') {
    return {
      sheet_tab: raw,
      page_title: raw,
      included: true,
      grid_data: [],
    };
  }
  if (typeof raw !== 'object') {
    console.error('[coercePageEntry] invalid entry at index', index, raw);
    return null;
  }
  const sheet_tab = String(raw.sheet_tab || raw.sheetName || raw.code || ('Sheet ' + (index + 1)));
  const page_title = String(raw.page_title || raw.title || sheet_tab);
  const grid_data = Array.isArray(raw.grid_data)
    ? raw.grid_data
    : (Array.isArray(raw.data) ? raw.data : []);
  return {
    sheet_tab,
    page_title,
    included: raw.included !== false,
    grid_data,
    code: String(raw.code || deriveCode(sheet_tab, index)),
  };
}

/** Normalize full project.pages after JSON parse — must run before any render. */
function normalizeProjectPages() {
  if (!project) return;
  if (!Array.isArray(project.pages)) {
    console.error('[normalizeProjectPages] project.pages is not an array:', project.pages);
    project.pages = [];
    return;
  }
  project.pages = project.pages
    .map((raw, i) => coercePageEntry(raw, i))
    .filter(Boolean);
}

function getActiveSheet() {
  if (!project || !Array.isArray(project.pages) || project.pages.length === 0) return null;
  if (activeIndex < 0 || activeIndex >= project.pages.length) activeIndex = 0;
  return project.pages[activeIndex] || null;
}

/** Table-only mode — no Fabric canvas. Stub prevents ReferenceError from legacy onclick. */
function initCanvas() {
  /* intentionally empty */
}
window.initCanvas = initCanvas;

/* ═══════════════════════════════════════════════════════════════
   TITLE BLOCK BUILDER
   ═══════════════════════════════════════════════════════════════ */
function buildTitleBlockHTML(sheetObj) {
  if (!sheetObj || typeof sheetObj !== 'object') {
    console.error('[buildTitleBlockHTML] Invalid sheetObj:', sheetObj);
    sheetObj = { page_title: 'UNTITLED SHEET', sheet_tab: '—', included: true };
  }
  const projName = (project && project.projectName) || 'UNTITLED PROJECT';
  const location = (project && project.siteAddress) || '—';
  const date = (project && project.date) || '—';
  const title = sheetObj.page_title || sheetObj.sheet_tab || 'UNTITLED SHEET';
  const { num, total } = pageNumber(sheetObj);
  const sheetNo = num > 0 ? String(num) : '—';
  const pageStr = total > 0 ? `PAGE ${num} OF ${total}` : 'NOT INCLUDED';

  return `
    <div class="tb-col">
      <div class="tb-rev-head">Revisions</div>
      <div class="tb-rev-grid">
        <span>Rev</span><span>Date</span><span>Description</span>
        <span>&nbsp;</span><span>&nbsp;</span><span>&nbsp;</span>
        <span>&nbsp;</span><span>&nbsp;</span><span>&nbsp;</span>
      </div>
    </div>
    <div class="tb-col tb-firm">
      <span class="tb-label">Firm</span>
      <img src="/static/LOGO-750px.png" alt="Singh360" onerror="this.style.display='none'" />
      <div class="tb-firm-addr">Singh360 Inc.<br/>Engineering Services</div>
    </div>
    <div class="tb-col">
      <div class="tb-proj-field"><span class="tb-label">Project Name</span><span class="tb-proj-val tb-value">${esc(projName)}</span></div>
      <div class="tb-proj-field"><span class="tb-label">Location</span><span class="tb-proj-val tb-value">${esc(location)}</span></div>
      <div class="tb-proj-field"><span class="tb-label">Date</span><span class="tb-proj-val tb-value">${esc(date)}</span></div>
    </div>
    <div class="tb-col tb-sheet-title-col">
      <div class="tb-sheet-title-text tb-value">${esc(title)}</div>
    </div>
    <div class="tb-col">
      <div class="tb-num-top">
        <span class="tb-label">Sheet No.</span>
        <span class="tb-num-big tb-value">${esc(sheetNo)}</span>
      </div>
      <div class="tb-num-bot tb-value">${esc(pageStr)}</div>
    </div>`;
}

/* ═══════════════════════════════════════════════════════════════
   renderSheet — THE CORE RENDERER (dead simple)
   ═══════════════════════════════════════════════════════════════ */
function renderSheet(sheetObj) {
  if (!sheetObj || typeof sheetObj !== 'object') {
    console.error('[renderSheet] Invalid sheetObj:', sheetObj);
    return;
  }

  const inner = document.getElementById('paper-inner');
  if (!inner) {
    console.error('[renderSheet] #paper-inner not found');
    return;
  }

  /* Wipe the paper */
  inner.innerHTML = '';

  const content = document.createElement('div');
  content.id = 'paper-content';

  const grid = sheetObj.grid_data;
  if (Array.isArray(grid) && grid.length > 0) {
    const table = document.createElement('table');
    table.className = 'sheet-table';

    for (let r = 0; r < grid.length; r++) {
      const row = grid[r];
      if (!Array.isArray(row)) {
        console.error('[renderSheet] grid_data row', r, 'is not an array:', row);
        continue;
      }
      const tr = document.createElement('tr');
      for (let c = 0; c < row.length; c++) {
        const td = document.createElement('td');
        td.contentEditable = 'true';
        td.dataset.row = String(r);
        td.dataset.col = String(c);
        const cell = row[c];
        const text = (cell == null || cell === '') ? '' : String(cell);
        if (text === '') {
          td.innerHTML = '&nbsp;';
        } else {
          td.textContent = text;
        }
        td.addEventListener('input', () => {
          let val = td.textContent;
          if (val === '\u00a0') val = '';
          if (!sheetObj.grid_data[r]) sheetObj.grid_data[r] = [];
          sheetObj.grid_data[r][c] = val;
          scheduleSave();
        });
        td.addEventListener('blur', () => {
          if (!td.textContent.trim()) td.innerHTML = '&nbsp;';
        });
        tr.appendChild(td);
      }
      table.appendChild(tr);
    }
    content.appendChild(table);
  } else {
    const empty = document.createElement('p');
    empty.id = 'empty-msg';
    empty.textContent = 'NO GRID DATA — CANVAS SHEET';
    content.appendChild(empty);
  }

  inner.appendChild(content);

  const tb = document.createElement('div');
  tb.id = 'title-block';
  tb.innerHTML = buildTitleBlockHTML(sheetObj);
  inner.appendChild(tb);
}

/* ═══════════════════════════════════════════════════════════════
   SIDEBAR CHECKLIST
   ═══════════════════════════════════════════════════════════════ */
function renderChecklist() {
  const container = document.getElementById('checklist');
  if (!container) {
    console.error('[renderChecklist] #checklist not found');
    return;
  }
  container.innerHTML = '';

  if (!project || !Array.isArray(project.pages)) {
    console.error('[renderChecklist] No project.pages array:', project);
    return;
  }

  project.pages.forEach((sheetObj, index) => {
    if (!sheetObj || typeof sheetObj !== 'object') {
      console.error('[renderChecklist] skipping invalid page at index', index, sheetObj);
      return;
    }
    const label = document.createElement('label');
    label.className = 'check-item' + (index === activeIndex ? ' active' : '');

    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = sheetObj.included !== false;
    cb.addEventListener('change', () => {
      sheetObj.included = cb.checked;
      renderSheet(sheetObj);
      scheduleSave();
    });

    const span = document.createElement('span');
    span.textContent = sheetObj.page_title || sheetObj.sheet_tab || ('Sheet ' + (index + 1));

    label.appendChild(cb);
    label.appendChild(span);

    label.addEventListener('click', (e) => {
      if (e.target === cb) return;
      selectSheet(index);
    });

    container.appendChild(label);
  });
}

function selectSheet(index) {
  if (!project || !Array.isArray(project.pages) || project.pages.length === 0) {
    console.error('[selectSheet] No pages loaded');
    return;
  }
  if (index < 0 || index >= project.pages.length) {
    console.error('[selectSheet] Index out of range:', index, project.pages.length);
    return;
  }
  const sheetObj = project.pages[index];
  if (!sheetObj || typeof sheetObj !== 'object') {
    console.error('[selectSheet] Invalid page at index', index, sheetObj);
    return;
  }
  activeIndex = index;
  renderChecklist();
  renderSheet(sheetObj);
  setStatus('Editing: ' + (sheetObj.page_title || sheetObj.sheet_tab || ('Sheet ' + (index + 1))));
}

/* ═══════════════════════════════════════════════════════════════
   PROJECT LOAD / SAVE / UPLOAD
   ═══════════════════════════════════════════════════════════════ */
function bindMetaFields() {
  document.getElementById('meta-name').addEventListener('input', (e) => {
    if (!project) return;
    project.projectName = e.target.value;
    const sheet = getActiveSheet();
    if (sheet) renderSheet(sheet);
    scheduleSave();
  });
  document.getElementById('meta-location').addEventListener('input', (e) => {
    if (!project) return;
    project.siteAddress = e.target.value;
    const sheet = getActiveSheet();
    if (sheet) renderSheet(sheet);
    scheduleSave();
  });
  document.getElementById('meta-date').addEventListener('input', (e) => {
    if (!project) return;
    project.date = e.target.value;
    const sheet = getActiveSheet();
    if (sheet) renderSheet(sheet);
    scheduleSave();
  });
}

function fillMetaFields() {
  if (!project) return;
  document.getElementById('meta-name').value = project.projectName || '';
  document.getElementById('meta-location').value = project.siteAddress || '';
  document.getElementById('meta-date').value = project.date || '';
}

function scheduleSave() {
  if (!project || !project.id) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveProject, 600);
  setStatus('Saving…');
}

async function saveProject() {
  if (!project || !project.id) return;
  const res = await fetch('/api/projects/' + project.id, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(project),
  });
  if (!res.ok) {
    console.error('[saveProject] HTTP', res.status, await res.text());
    setStatus('Save failed');
    return;
  }
  setStatus('Saved');
}

async function loadProject(id) {
  const res = await fetch('/api/projects/' + id);
  if (!res.ok) {
    console.error('[loadProject] HTTP', res.status);
    setStatus('Load failed');
    return;
  }
  const raw = await res.json();
  project = raw;
  console.log('[loadProject] Raw payload', project);

  normalizeProjectPages();
  console.log('[loadProject] Normalized pages:', project.pages.length, project.pages);

  project.id = id;
  history.replaceState({}, '', '?project=' + id);
  activeIndex = 0;
  fillMetaFields();
  renderChecklist();

  const first = getActiveSheet();
  if (first) {
    renderSheet(first);
    setStatus(project.pages.length + ' sheets loaded');
  } else {
    renderEmptyPaper();
    setStatus('No sheets in workbook');
  }
}

function renderEmptyPaper() {
  const inner = document.getElementById('paper-inner');
  if (!inner) return;
  inner.innerHTML = '';
  const content = document.createElement('div');
  content.id = 'paper-content';
  const msg = document.createElement('p');
  msg.id = 'empty-msg';
  msg.textContent = 'Upload a workbook to begin.';
  content.appendChild(msg);
  inner.appendChild(content);
  const tb = document.createElement('div');
  tb.id = 'title-block';
  tb.innerHTML = buildTitleBlockHTML({ page_title: 'UNTITLED SHEET', sheet_tab: '—', included: true });
  inner.appendChild(tb);
}

async function uploadWorkbook() {
  const input = document.getElementById('file-input');
  const file = input.files && input.files[0];
  if (!file) return;

  setStatus('Uploading…');
  const fd = new FormData();
  fd.append('file', file);

  const res = await fetch('/api/projects/new', { method: 'POST', body: fd });
  if (!res.ok) {
    const err = await res.json();
    console.error('[uploadWorkbook]', err);
    setStatus('Upload failed');
    alert(err.error || 'Upload failed');
    return;
  }
  const data = await res.json();
  input.value = '';
  await loadProject(data.id);
}

/* ═══════════════════════════════════════════════════════════════
   PRINT MODE (Playwright PDF export)
   ═══════════════════════════════════════════════════════════════ */
async function runPrintMode(projectId) {
  document.getElementById('app').style.display = 'none';
  const root = document.getElementById('print-root');
  root.style.display = 'block';
  root.innerHTML = '';

  const res = await fetch('/api/projects/' + projectId);
  if (!res.ok) {
    console.error('[runPrintMode] HTTP', res.status);
    return;
  }
  const proj = await res.json();
  project = proj;
  normalizeProjectPages();
  const sheets = project.pages.filter(p => p && p.included !== false);

  sheets.forEach((sheetObj) => {
    if (!sheetObj || typeof sheetObj !== 'object') return;
    const page = document.createElement('div');
    page.className = 'print-page';

    const paper = document.createElement('div');
    paper.style.cssText = 'width:1632px;height:1056px;background:#fff;position:relative;border:4px solid #000;padding:4px;margin:0 auto;';

    const inner = document.createElement('div');
    inner.style.cssText = 'width:100%;height:100%;border:1px solid #000;position:relative;background:#fff;overflow:hidden;';

    const content = document.createElement('div');
    content.style.cssText = 'position:absolute;top:0;left:0;right:0;bottom:110px;overflow:hidden;padding:20px 24px;';

    const grid = sheetObj.grid_data;
    if (Array.isArray(grid) && grid.length > 0) {
      const table = document.createElement('table');
      table.className = 'sheet-table';
      grid.forEach((row) => {
        const tr = document.createElement('tr');
        row.forEach((cell) => {
          const td = document.createElement('td');
          const text = (cell == null || cell === '') ? '' : String(cell);
          td.innerHTML = text === '' ? '&nbsp;' : esc(text);
          tr.appendChild(td);
        });
        table.appendChild(tr);
      });
      content.appendChild(table);
    }

    inner.appendChild(content);

    const tb = document.createElement('div');
    tb.id = 'title-block';
    tb.innerHTML = buildTitleBlockHTML(sheetObj);
    inner.appendChild(tb);

    paper.appendChild(inner);
    page.appendChild(paper);
    root.appendChild(page);
  });

  document.body.setAttribute('data-print-ready', '1');
}

/* ═══════════════════════════════════════════════════════════════
   INIT — DOM ready, then optional project load
   ═══════════════════════════════════════════════════════════════ */
function bootApp() {
  document.getElementById('btn-upload').addEventListener('click', () => {
    document.getElementById('file-input').click();
  });
  document.getElementById('file-input').addEventListener('change', uploadWorkbook);
  bindMetaFields();

  const params = new URLSearchParams(location.search);
  const projId = params.get('project');
  const isPrint = params.get('print') === '1';

  if (isPrint && projId) {
    runPrintMode(projId);
  } else if (projId) {
    loadProject(projId);
  } else {
    renderEmptyPaper();
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', bootApp);
} else {
  bootApp();
}
</script>
</body>
</html>
