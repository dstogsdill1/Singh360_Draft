name: Apply V39 Playwright Arg Fix

on:
  pull_request:
    branches:
      - repair/current-dashboard-live-v10
    paths:
      - '.github/workflows/apply-v39-playwright-arg-fix.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Fix Playwright keyword argument
        shell: python
        run: |
          from pathlib import Path

          path = Path('scripts/smoke_symbol_library_browser_v39.py')
          text = path.read_text(encoding='utf-8')
          old = '''        }""",
              {"projectId": PROJECT_ID, "expected": expected},
              timeout=timeout_ms,
          )'''
          new = '''        }""",
              arg={"projectId": PROJECT_ID, "expected": expected},
              timeout=timeout_ms,
          )'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one wait_for_function argument block, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')

      - name: Compile and push source fix
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/smoke_symbol_library_browser_v39.py
          git diff --check
          git config user.name 'Singh360 Controlled Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/smoke_symbol_library_browser_v39.py
          git commit -m 'Fix Playwright browser smoke argument passing'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
