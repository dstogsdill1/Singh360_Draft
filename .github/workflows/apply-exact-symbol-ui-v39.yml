name: Apply Exact Symbol UI V39

on:
  push:
    branches:
      - repair/exact-symbol-component-library-v39-ui
    paths:
      - scripts/apply_exact_symbol_ui_v39.py
      - .github/workflows/apply-exact-symbol-ui-v39.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: repair/exact-symbol-component-library-v39-ui
          fetch-depth: 0

      - name: Apply scoped UI edit
        run: python scripts/apply_exact_symbol_ui_v39.py

      - name: Diff integrity
        run: git diff --check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript and Vite production build
        working-directory: frontend
        run: npm run build

      - name: Commit the validated panel edit
        shell: bash
        run: |
          if git diff --quiet -- frontend/src/components/LibraryPanelV2.tsx; then
            echo "Scoped UI edit already installed."
            exit 0
          fi
          git config user.name "Singh360 Validation Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- frontend/src/components/LibraryPanelV2.tsx
          git commit -m "Add refrigeration symbol collection quick filter"
          git push origin HEAD:repair/exact-symbol-component-library-v39-ui
