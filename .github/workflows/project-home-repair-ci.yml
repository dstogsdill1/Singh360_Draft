name: Project Home Repair CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Compile backend
        run: python -m compileall server.py core

      - name: Regression-test existing project workbook recovery
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from core.project_model import ensure_project_shape

          with TemporaryDirectory() as root:
              project_folder = Path(root) / 'HEB-829__legacyproject01'
              workbook_dir = project_folder / 'sources' / 'workbook'
              workbook_dir.mkdir(parents=True)
              workbook = workbook_dir / '829_MTN_EMS_V1.xlsm'
              workbook.write_bytes(b'unchanged-source-copy')

              legacy = {
                  'id': 'legacyproject01',
                  'projectFolder': str(project_folder),
                  'metadata': {'projectName': 'HEB 829', 'sourceFile': 'temp_0123456789abcdef.xlsm'},
                  'sources': [{
                      'id': 'src_legacy',
                      'type': 'workbook',
                      'name': 'temp_0123456789abcdef.xlsm',
                      'path': str(Path(root) / 'temp_0123456789abcdef.xlsm'),
                  }],
                  'worksheets': [],
                  'pages': [],
              }

              repaired = ensure_project_shape(legacy)
              assert repaired['sourceWorkbookName'] == workbook.name, repaired['sourceWorkbookName']
              assert repaired['metadata']['sourceFile'] == workbook.name, repaired['metadata']['sourceFile']
              assert repaired['sources'][0]['name'] == workbook.name, repaired['sources'][0]
              assert repaired['sources'][0]['path'] == str(workbook), repaired['sources'][0]

          print('Existing project workbook recovery: PASS')
          PY

      - name: Smoke-import sample workbook
        run: python scripts/smoke_import_workbook.py sample_data/S360_EMS_Simple_Workbook.xlsx

      - name: Check API health route
        run: |
          python - <<'PY'
          from server import app
          client = app.test_client()
          response = client.get('/api/health')
          assert response.status_code == 200, response.data
          assert response.get_json() == {'ok': True}, response.get_json()
          print('API health: PASS')
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Chromium for browser verification
        run: python -m playwright install --with-deps chromium

      - name: Start Singh360 Draft
        run: |
          SINGH360_PORT=8765 python server.py > /tmp/singh360-server.log 2>&1 &
          echo $! > /tmp/singh360-server.pid
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8765/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/singh360-server.log
          exit 1

      - name: Create disposable sample project
        run: |
          python - <<'PY'
          import os
          import requests

          expected_name = 'S360_EMS_Simple_Workbook.xlsx'
          path = f'sample_data/{expected_name}'
          with open(path, 'rb') as workbook:
              response = requests.post(
                  'http://127.0.0.1:8765/api/projects/new',
                  files={'file': (expected_name, workbook)},
                  timeout=120,
              )
          response.raise_for_status()
          payload = response.json()
          project_id = payload['id']

          project_response = requests.get(
              f'http://127.0.0.1:8765/api/projects/{project_id}',
              timeout=30,
          )
          project_response.raise_for_status()
          project = project_response.json()
          assert project.get('sourceWorkbookName') == expected_name, project.get('sourceWorkbookName')
          assert project.get('metadata', {}).get('sourceFile') == expected_name, project.get('metadata', {}).get('sourceFile')
          workbook_sources = [source for source in project.get('sources', []) if source.get('type') == 'workbook']
          assert workbook_sources and workbook_sources[0].get('name') == expected_name, workbook_sources

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
              env_file.write(f'PROJECT_ID={project_id}\n')
          print(f'Disposable project: {project_id}')
          print(f'Workbook identity: {expected_name}')
          PY

      - name: Verify Project Home, page review, and editor handoff
        run: |
          mkdir -p browser-artifacts
          python - <<'PY'
          import os
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          base = 'http://127.0.0.1:8765/app'
          expected_name = 'S360_EMS_Simple_Workbook.xlsx'
          project_id = os.environ['PROJECT_ID']
          artifacts = Path('browser-artifacts')
          console_errors = []

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch()
              page = browser.new_page(viewport={'width': 1440, 'height': 1000})
              page.on('console', lambda message: console_errors.append(message.text) if message.type == 'error' else None)

              page.goto(base, wait_until='networkidle')
              page.get_by_role('heading', name='Drawing Package Editor').wait_for()
              page.get_by_role('button', name='Choose Workbook').wait_for()
              page.screenshot(path=str(artifacts / '01-all-projects.png'), full_page=True)

              page.goto(f'{base}?project={project_id}', wait_until='networkidle')
              page.get_by_role('button', name='Open Editor').wait_for()
              page.get_by_role('button', name='Review Included Pages').wait_for()
              page.get_by_text(expected_name, exact=True).wait_for()
              assert 'temp_' not in page.locator('body').inner_text().lower(), 'Temporary parser filename leaked into Project Home.'
              page.screenshot(path=str(artifacts / '02-project-home.png'), full_page=True)

              page.goto(f'{base}?project={project_id}&review=1', wait_until='networkidle')
              page.get_by_role('heading', name='Review drawing pages').wait_for()
              save_and_open = page.get_by_role('button', name='Save & Open Editor')
              save_and_open.wait_for()
              assert page.locator('tbody tr').count() > 0, 'Page review table is empty.'
              assert page.locator('.vite-error-overlay, #webpack-dev-server-client-overlay').count() == 0
              page.screenshot(path=str(artifacts / '03-page-review.png'), full_page=True)

              save_and_open.click()
              page.wait_for_url(f'**/app?project={project_id}&editor=1', timeout=30000)
              page.get_by_text('Published Package', exact=True).wait_for(timeout=30000)
              page.get_by_text('Workbook Drafts', exact=True).wait_for(timeout=30000)
              assert page.locator('.vite-error-overlay, #webpack-dev-server-client-overlay').count() == 0
              page.screenshot(path=str(artifacts / '04-editor-handoff.png'), full_page=True)

              if console_errors:
                  raise AssertionError(f'Browser console errors: {console_errors}')
              browser.close()

          print('Browser verification: PASS')
          PY

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-home-browser-screenshots
          path: browser-artifacts
          if-no-files-found: warn

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/singh360-server.log || true
