name: Apply V39 Component Source Metadata

on:
  pull_request:
    branches:
      - repair/current-dashboard-live-v10
    paths:
      - '.github/workflows/apply-v39-component-source-metadata.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Persist canonical component asset identity
        shell: python
        run: |
          from pathlib import Path

          path = Path('frontend/src/components/CanvasEditor.tsx')
          text = path.read_text(encoding='utf-8')
          old = '''          (img as unknown as Record<string, unknown>).objName = name;
          if (meta?.category) (img as unknown as Record<string, unknown>).symCategory = meta.category;'''
          new = '''          const componentRecord = img as unknown as Record<string, unknown>;
          componentRecord.objName = name;
          componentRecord.sourceUrl = assetUrl;
          if (meta?.category) componentRecord.symCategory = meta.category;'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one direct component metadata block, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')

      - name: Compile and push source fix
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'Singh360 Controlled Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add frontend/src/components/CanvasEditor.tsx
          git commit -m 'Persist canonical asset URL on inserted components'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
