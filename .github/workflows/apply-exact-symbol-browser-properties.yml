name: Apply Exact Symbol Browser Properties Navigation

on:
  pull_request:
    branches:
      - repair/current-dashboard-live-v10
    paths:
      - '.github/workflows/apply-exact-symbol-browser-properties.yml'

permissions:
  contents: write

jobs:
  apply-browser-navigation:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Update browser navigation with exact bounded replacement
        shell: python
        run: |
          from pathlib import Path

          path = Path('scripts/smoke_symbol_library_browser_v39.py')
          text = path.read_text(encoding='utf-8')
          old = '''def _open_components(page: Page) -> None:
              components = page.get_by_role("button", name="Components", exact=True)
              expect(components).to_be_visible(timeout=30000)
              if components.get_attribute("aria-expanded") != "true":
                  components.click()
              filter_button = page.get_by_role("button", name=re.compile(r"^Refrigeration Symbols \\(15\\)$"))
              expect(filter_button).to_be_visible(timeout=30000)
              if filter_button.get_attribute("aria-pressed") != "true":
                  filter_button.click()
              expect(page.locator(".libv2-card")).to_have_count(15, timeout=30000)
          '''
          new = '''def _open_components(page: Page) -> None:
              components = page.get_by_role("button", name="Components", exact=True)
              if components.count() == 0:
                  properties = page.get_by_role("button", name=re.compile(r"Properties$"))
                  expect(properties).to_be_visible(timeout=30000)
                  properties.click()
              expect(components).to_be_visible(timeout=30000)
              if components.get_attribute("aria-expanded") != "true":
                  components.click()
              filter_button = page.get_by_role("button", name=re.compile(r"^Refrigeration Symbols \\(15\\)$"))
              expect(filter_button).to_be_visible(timeout=30000)
              if filter_button.get_attribute("aria-pressed") != "true":
                  filter_button.click()
              expect(page.locator(".libv2-card")).to_have_count(15, timeout=30000)
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected one exact _open_components block, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')

      - name: Compile and commit browser test source
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/smoke_symbol_library_browser_v39.py
          git diff --check
          git config user.name 'Singh360 Controlled Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/smoke_symbol_library_browser_v39.py
          git commit -m 'Open Properties before Components in V39 browser smoke'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
