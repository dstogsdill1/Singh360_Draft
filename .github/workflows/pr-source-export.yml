name: PR Source Export

on:
  pull_request:
    branches:
      - repair/current-dashboard-live-v10
    paths:
      - '.github/workflows/pr-source-export.yml'
      - 'frontend/**'
      - 'scripts/**'
      - 'defaults/**'
      - 'core/**'
      - 'server.py'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Package repository source
        shell: bash
        run: |
          tar \
            --exclude='.git' \
            --exclude='.docs' \
            --exclude='frontend/node_modules' \
            --exclude='frontend/dist' \
            --exclude='*.log' \
            -czf "$RUNNER_TEMP/singh360-pr-source.tar.gz" .

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: singh360-pr-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/singh360-pr-source.tar.gz
          if-no-files-found: error
          retention-days: 1
