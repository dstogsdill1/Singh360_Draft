name: Apply V40 Library UI

on:
  push:
    branches:
      - repair/component-library-v40-curation
    paths:
      - '.github/workflows/apply-v40-library-ui.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: repair/component-library-v40-curation
          fetch-depth: 0

      - name: Apply function-scoped V40 UI integration
        shell: python
        run: |
          from pathlib import Path

          panel_path = Path('frontend/src/components/LibraryPanelV2.tsx')
          panel = panel_path.read_text(encoding='utf-8')
          if "const PLAN_MARKER_COLLECTION = 'Singh360 Plan Markers';" not in panel:
              anchor = "const REFRIGERATION_SYMBOL_COLLECTION = 'Refrigeration Controls Symbols';"
              replacement = "const MAPPER_SYMBOL_COLLECTION = 'Refrigeration Controls Symbols';\nconst PLAN_MARKER_COLLECTION = 'Singh360 Plan Markers';"
              if panel.count(anchor) != 1:
                  raise SystemExit(f'collection constant anchor count={panel.count(anchor)}')
              panel = panel.replace(anchor, replacement, 1)

              preset_anchor = "  'Symbols / Markers',\n  'Needs Review',"
              preset_replacement = "  'Symbols / Markers',\n  'Refrigeration Controls Symbols',\n  'Singh360 Plan Markers',\n  'Safety Signage',\n  'Callout Numbers',\n  'Needs Review',"
              if panel.count(preset_anchor) != 1:
                  raise SystemExit(f'collection preset anchor count={panel.count(preset_anchor)}')
              panel = panel.replace(preset_anchor, preset_replacement, 1)

              count_anchor = """  const refrigerationSymbolCount = useMemo(
    () => components.filter(
      (component) => !isRetired(component)
        && collectionFor(component) === REFRIGERATION_SYMBOL_COLLECTION,
    ).length,
    [components],
  );
"""
              count_replacement = """  const mapperSymbolCount = useMemo(
    () => components.filter(
      (component) => !isRetired(component)
        && collectionFor(component) === MAPPER_SYMBOL_COLLECTION,
    ).length,
    [components],
  );
  const planMarkerCount = useMemo(
    () => components.filter(
      (component) => !isRetired(component)
        && collectionFor(component) === PLAN_MARKER_COLLECTION,
    ).length,
    [components],
  );
"""
              if panel.count(count_anchor) != 1:
                  raise SystemExit(f'count block anchor count={panel.count(count_anchor)}')
              panel = panel.replace(count_anchor, count_replacement, 1)

              quick_anchor = """        <div className="libv2-row libv2-quick-filters">
          <button
            className={collection === REFRIGERATION_SYMBOL_COLLECTION ? 'active' : undefined}
            style={collection === REFRIGERATION_SYMBOL_COLLECTION
              ? { fontWeight: 800, background: '#e0f2fe', borderColor: '#0284c7' }
              : undefined}
            aria-pressed={collection === REFRIGERATION_SYMBOL_COLLECTION}
            onClick={() => {
              setCollection((current) => current === REFRIGERATION_SYMBOL_COLLECTION
                ? 'all'
                : REFRIGERATION_SYMBOL_COLLECTION);
              setCategory('all');
              setQuery('');
            }}
          >
            Refrigeration Symbols ({refrigerationSymbolCount})
          </button>
          {collection !== 'all' && (
            <button onClick={() => setCollection('all')}>Show All Components</button>
          )}
        </div>
"""
              quick_replacement = """        <div className="libv2-row libv2-quick-filters">
          <button
            className={collection === MAPPER_SYMBOL_COLLECTION ? 'active' : undefined}
            aria-pressed={collection === MAPPER_SYMBOL_COLLECTION}
            title="Square highlighted symbols used by Symbol Mapper on existing drawings"
            onClick={() => {
              setCollection((current) => current === MAPPER_SYMBOL_COLLECTION ? 'all' : MAPPER_SYMBOL_COLLECTION);
              setCategory('all');
              setQuery('');
            }}
          >
            Mapper Highlights ({mapperSymbolCount})
          </button>
          <button
            className={collection === PLAN_MARKER_COLLECTION ? 'active' : undefined}
            aria-pressed={collection === PLAN_MARKER_COLLECTION}
            title="Simple colored-ring markers for direct placement on plan and layout pages"
            onClick={() => {
              setCollection((current) => current === PLAN_MARKER_COLLECTION ? 'all' : PLAN_MARKER_COLLECTION);
              setCategory('all');
              setQuery('');
            }}
          >
            Plan Markers ({planMarkerCount})
          </button>
          {collection !== 'all' && (
            <button onClick={() => setCollection('all')}>Show All Components</button>
          )}
        </div>
"""
              if panel.count(quick_anchor) != 1:
                  raise SystemExit(f'quick filter anchor count={panel.count(quick_anchor)}')
              panel = panel.replace(quick_anchor, quick_replacement, 1)

              preferred_anchor = """  const preferredLegendTemplate = legendTemplates.find((template) => template.id === 'singh360-refrigeration-symbols-standard')
    || legendTemplates.find((template) => template.name === 'Singh360 Refrigeration Symbols')
    || legendTemplates[0];
"""
              preferred_replacement = """  const preferredLegendTemplate = legendTemplates.find((template) => template.id === 'singh360-plan-marker-legend')
    || legendTemplates.find((template) => template.id === 'singh360-refrigeration-symbols-standard')
    || legendTemplates[0];
"""
              if panel.count(preferred_anchor) != 1:
                  raise SystemExit(f'preferred legend anchor count={panel.count(preferred_anchor)}')
              panel = panel.replace(preferred_anchor, preferred_replacement, 1)

              compile(panel, str(panel_path), 'exec') if False else None
              panel_path.write_text(panel, encoding='utf-8')
          else:
              print('LibraryPanelV2 V40 integration already installed.')

          modal_path = Path('frontend/src/components/SymbolLegendModal.tsx')
          modal = modal_path.read_text(encoding='utf-8')
          old = "symbolUrl: rendererVersion === CANONICAL_RENDERER ? assets.get(key) : undefined,"
          new = "symbolUrl: stringField(item, 'symbolUrl') || (rendererVersion === CANONICAL_RENDERER ? assets.get(key) : undefined),"
          if new not in modal:
              if modal.count(old) != 1:
                  raise SystemExit(f'saved legend symbolUrl anchor count={modal.count(old)}')
              modal = modal.replace(old, new, 1)
          modal = modal.replace(
              "`${template.name || 'Saved legend'} loaded · ${next.length} symbols · exact V39 assets linked`",
              "`${template.name || 'Saved legend'} loaded · ${next.length} symbols · exact library assets linked`",
          )
          modal_path.write_text(modal, encoding='utf-8')

      - name: Validate UI before commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          panel = Path('frontend/src/components/LibraryPanelV2.tsx').read_text(encoding='utf-8')
          modal = Path('frontend/src/components/SymbolLegendModal.tsx').read_text(encoding='utf-8')
          required_panel = [
              "Mapper Highlights ({mapperSymbolCount})",
              "Plan Markers ({planMarkerCount})",
              "const PLAN_MARKER_COLLECTION = 'Singh360 Plan Markers';",
              "singh360-plan-marker-legend",
          ]
          required_modal = [
              "stringField(item, 'symbolUrl') ||",
              "exact library assets linked",
          ]
          missing = [token for token in required_panel if token not in panel]
          missing += [token for token in required_modal if token not in modal]
          if missing:
              raise SystemExit(f'Missing V40 UI tokens: {missing}')
          print('PASS: V40 UI tokens installed')
          PY
          cd frontend
          npm ci
          npm run build
          cd ..
          git diff --check

      - name: Commit V40 UI integration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- frontend/src/components/LibraryPanelV2.tsx frontend/src/components/SymbolLegendModal.tsx; then
            echo 'No UI source change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/components/LibraryPanelV2.tsx frontend/src/components/SymbolLegendModal.tsx
          git commit -m 'Expose separate mapper and plan marker collections'
          git push origin HEAD:repair/component-library-v40-curation
