name: Frontend Build

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-build.yml'
      - '.github/v32_2_validation/**'
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply V32.2 validation patches
        run: |
          cd ..
          patches=(
            .github/v32_2_validation/frontend_src_model_types.patch
            .github/v32_2_validation/frontend_src_api_client.patch
            .github/v32_2_validation/canvas_core.patch
            .github/v32_2_validation/canvas_helpers.patch
            .github/v32_2_validation/canvas_guides.patch
            .github/v32_2_validation/canvas_images.patch
            .github/v32_2_validation/canvas_symbols.patch
            .github/v32_2_validation/canvas_update.patch
            .github/v32_2_validation/frontend_src_components_PropertiesPanel.patch
            .github/v32_2_validation/frontend_src_components_PdfCropModal.patch
            .github/v32_2_validation/frontend_src_components_SymbolLegendModal.patch
            .github/v32_2_validation/frontend_src_components_LibraryPanelV2.patch
            .github/v32_2_validation/frontend_src_components_SheetManager.patch
            .github/v32_2_validation/frontend_src_components_PageManagerModal.patch
            .github/v32_2_validation/frontend_src_components_ProjectDashboard.patch
            .github/v32_2_validation/frontend_src_App.patch
            .github/v32_2_validation/frontend_src_styles_app.patch
          )
          for patch in "${patches[@]}"; do
            echo "Applying ${patch}"
            git apply "${patch}"
          done
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and build
        id: frontend_build
        continue-on-error: true
        run: |
          set +e
          npm run build > ../v32-build.log 2>&1
          code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          cat ../v32-build.log
          exit ${code}
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v32-build-log
          path: v32-build.log
          if-no-files-found: error
          retention-days: 3
      - name: Enforce build result
        if: steps.frontend_build.outcome == 'failure'
        run: exit 1
