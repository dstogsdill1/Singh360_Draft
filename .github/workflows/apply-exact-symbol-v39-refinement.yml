name: Apply Exact Symbol V39 Refinement

on:
  pull_request:
    branches:
      - repair/current-dashboard-live-v10
    paths:
      - '.github/workflows/apply-exact-symbol-v39-refinement.yml'
      - 'patch/exact-symbol-v39-refinement.patch'

permissions:
  contents: write

jobs:
  apply-refinement:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Verify and apply scoped refinement
        shell: bash
        run: |
          set -euo pipefail
          git apply --check patch/exact-symbol-v39-refinement.patch
          git apply patch/exact-symbol-v39-refinement.patch

      - name: Run focused safety gates
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/smoke_symbol_legend_v39_parity.py
          python -m scripts.smoke_symbol_legend_v39_parity
          git diff --check

      - name: Commit production refinement only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Singh360 Controlled Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            docs/CANONICAL_REFRIGERATION_SYMBOL_COMPONENTS.md \
            frontend/src/components/LibraryPanelV2.tsx \
            frontend/src/components/SymbolLegendModal.tsx \
            scripts/smoke_symbol_legend_v39_parity.py
          git commit -m 'Keep saved legends isolated from the live symbol standard'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
