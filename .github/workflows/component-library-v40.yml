name: Component Library V40

on:
  push:
    branches:
      - repair/component-library-v40-curation
    paths:
      - 'scripts/install_component_library_v40.py'
      - 'scripts/smoke_component_library_v40.py'
      - 'scripts/install_callout_number_components.py'
      - 'scripts/install_symbol_standard_v39.py'
      - 'core/library_v2.py'
      - 'core/legend_template_store.py'
      - 'frontend/**'
      - '.github/workflows/component-library-v40.yml'
  pull_request:
    paths:
      - 'scripts/install_component_library_v40.py'
      - 'scripts/smoke_component_library_v40.py'
      - 'scripts/install_callout_number_components.py'
      - 'scripts/install_symbol_standard_v39.py'
      - 'core/library_v2.py'
      - 'core/legend_template_store.py'
      - 'frontend/**'
      - '.github/workflows/component-library-v40.yml'

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile V40 migration and dependencies
        run: python -m py_compile core/library_v2.py core/legend_template_store.py scripts/install_callout_number_components.py scripts/install_symbol_standard_v39.py scripts/install_component_library_v40.py scripts/smoke_component_library_v40.py

      - name: Existing V39 exact-marker regression
        run: python -m scripts.smoke_symbol_standard_v39

      - name: V40 isolated preservation and idempotence regression
        id: v40_smoke
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m scripts.smoke_component_library_v40 2>&1 | tee v40-smoke.log

      - name: Upload V40 smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-library-v40-smoke-${{ matrix.os }}
          path: v40-smoke.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce V40 smoke gate
        if: steps.v40_smoke.outcome == 'failure'
        run: python -c "raise SystemExit(1)"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript and Vite production build
        working-directory: frontend
        run: npm run build

      - name: Diff integrity
        run: git diff --check
