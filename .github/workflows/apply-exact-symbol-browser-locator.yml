name: Apply Exact Symbol Browser Locator

on:
  pull_request:
    branches:
      - repair/current-dashboard-live-v10
    paths:
      - '.github/workflows/apply-exact-symbol-browser-locator.yml'
      - 'patch/exact-symbol-browser-locator.patch'

permissions:
  contents: write

jobs:
  apply-browser-locator:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Diagnose stable editor locator patch
        id: patch_check
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .validation/browser-locator-patch
          git apply --check --verbose patch/exact-symbol-browser-locator.patch 2>&1 | tee .validation/browser-locator-patch/git-apply-check.log

      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-symbol-browser-locator-patch
          path: .validation/browser-locator-patch/git-apply-check.log
          if-no-files-found: error
          retention-days: 1

      - name: Enforce patch validation
        if: steps.patch_check.outcome == 'failure'
        run: python -c "raise SystemExit(1)"

      - name: Apply and compile stable editor locator patch
        shell: bash
        run: |
          set -euo pipefail
          git apply patch/exact-symbol-browser-locator.patch
          python -m py_compile scripts/smoke_symbol_library_browser_v39.py
          git diff --check

      - name: Commit browser test source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Singh360 Controlled Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/smoke_symbol_library_browser_v39.py
          git commit -m 'Use stable editor locators in V39 browser smoke'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
