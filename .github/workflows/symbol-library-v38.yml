name: Symbol Library V38 Validation

on:
  push:
    branches:
      - validation/symbol-library-v38-20260725
  pull_request:
    paths:
      - defaults/symbol_mapper_standard.json
      - scripts/install_symbol_standard_v38.py
      - scripts/smoke_symbol_standard_v38.py
      - frontend/src/styles/rapidPageReview.css

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile backend and installer
        run: |
          python -m py_compile \
            core/library_v2.py \
            core/legend_template_store.py \
            scripts/install_symbol_standard_v38.py \
            scripts/smoke_symbol_standard_v38.py

      - name: Isolated symbol standard and library smoke test
        run: python scripts/smoke_symbol_standard_v38.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript and Vite production build
        working-directory: frontend
        run: npm run build

      - name: Verify compiled symbol and toolbar tokens
        working-directory: frontend
        run: |
          python - <<'PY'
          from pathlib import Path
          bundle = '\n'.join(
              path.read_text(encoding='utf-8', errors='ignore')
              for path in Path('dist/assets').glob('*')
              if path.suffix in {'.js', '.css'}
          )
          required = [
              'Include in Drawing:',
              'vt-page-filter-widget',
              'minmax(0,1fr)',
          ]
          missing = [token for token in required if token.replace(' ', '') not in bundle.replace(' ', '')]
          if missing:
              raise SystemExit(f'Missing compiled V38 tokens: {missing}')
          print(f'Verified {len(required)} compiled V38 tokens')
          PY

      - name: Diff integrity
        run: git diff --check
