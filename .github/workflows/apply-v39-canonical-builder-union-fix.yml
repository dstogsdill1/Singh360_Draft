name: Apply V39 Canonical Builder Union Fix

on:
  push:
    branches:
      - repair/exact-symbol-component-library-v39-parity
    paths:
      - '.github/workflows/apply-v39-canonical-builder-union-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/exact-symbol-component-library-v39-parity
          fetch-depth: 0

      - name: Apply function-scoped canonical union repair
        shell: python
        run: |
          from pathlib import Path

          library_path = Path('core/library_v2.py')
          text = library_path.read_text(encoding='utf-8')

          read_anchor = '''    # ---- read ------------------------------------------------------------
              def load(self, include_legacy: bool = False, include_retired: bool = False) -> dict:
          '''
          read_replacement = '''    # ---- read ------------------------------------------------------------
              @staticmethod
              def _canonical_standard_key(comp: dict) -> str:
                  source = comp.get("source")
                  if isinstance(source, dict):
                      key = str(source.get("standardKey") or "").strip()
                      if key:
                          return key
                  for tag in comp.get("tags") or []:
                      value = str(tag or "")
                      if value.startswith("singh360-symbol-key:"):
                          return value.split(":", 1)[1].strip()
                  return ""

              def load(self, include_legacy: bool = False, include_retired: bool = False) -> dict:
          '''
          if text.count(read_anchor) != 1:
              raise SystemExit(f'read anchor count was {text.count(read_anchor)}, expected 1')
          text = text.replace(read_anchor, read_replacement, 1)

          overlay_anchor = '''                if ov:
                              for key in EDITABLE_FIELDS:
                                  # Presence in an override is authoritative, even when cleared.
                                  if key in ov:
                                      merged[key] = ov[key]
                              if ov.get("favorite"):
                                  merged["favorite"] = True
          '''
          overlay_replacement = '''                if ov:
                              if self._canonical_standard_key(ov):
                                  # Stable Singh360 canonical metadata is authoritative over a stale
                                  # Component Builder export with the same id. Preserve extra builder
                                  # fields, but never let it erase renderer/source/sort identity.
                                  merged.update(ov)
                                  merged["origin"] = "manifest_canonical"
                              else:
                                  for key in EDITABLE_FIELDS:
                                      # Presence in an override is authoritative, even when cleared.
                                      if key in ov:
                                          merged[key] = ov[key]
                                  if ov.get("favorite"):
                                      merged["favorite"] = True
          '''
          if text.count(overlay_anchor) != 1:
              raise SystemExit(f'overlay anchor count was {text.count(overlay_anchor)}, expected 1')
          text = text.replace(overlay_anchor, overlay_replacement, 1)

          dedupe_anchor = '''            for c in legacy_candidates:
                          if self._identity_keys(c) & approved_keys:
                              stale_hidden += 1
                              continue
                          legacy_visible.append(c)
          '''
          dedupe_replacement = '''            for c in legacy_candidates:
                          identity = self._identity_keys(c)
                          if self._canonical_standard_key(c):
                              # Canonical symbols intentionally share short codes (the two S rows).
                              # Only exact stable id/hash collisions may hide one; weak name, part,
                              # or alias collisions from a stale builder export must not suppress it.
                              strong_identity = {
                                  key for key in identity
                                  if key.startswith("id:") or key.startswith("hash:")
                              }
                              duplicate = bool(strong_identity & approved_keys)
                          else:
                              duplicate = bool(identity & approved_keys)
                          if duplicate:
                              stale_hidden += 1
                              continue
                          legacy_visible.append(c)
          '''
          if text.count(dedupe_anchor) != 1:
              raise SystemExit(f'dedupe anchor count was {text.count(dedupe_anchor)}, expected 1')
          text = text.replace(dedupe_anchor, dedupe_replacement, 1)
          compile(text, str(library_path), 'exec')
          library_path.write_text(text, encoding='utf-8')

          smoke_path = Path('scripts/smoke_symbol_standard_v39.py')
          smoke = smoke_path.read_text(encoding='utf-8')
          import_anchor = '''from pathlib import Path


          REPO = Path(__file__).resolve().parents[1]
          '''
          import_replacement = '''from pathlib import Path

from core.library_v2 import LibraryV2


          REPO = Path(__file__).resolve().parents[1]
          '''
          if smoke.count(import_anchor) != 1:
              raise SystemExit(f'smoke import anchor count was {smoke.count(import_anchor)}, expected 1')
          smoke = smoke.replace(import_anchor, import_replacement, 1)

          test_anchor = '''        assert sum(len(entries) for entries in final_by_key.values()) == 15
                  assert any(component.get("id") == unrelated["id"] for component in final_components)
          '''
          test_replacement = '''        assert sum(len(entries) for entries in final_by_key.values()) == 15
                  assert any(component.get("id") == unrelated["id"] for component in final_components)

                  # A stale Component Builder export may contain a generic S component. The two
                  # canonical S rows (solenoid and clean switch) must remain visible because their
                  # stable Singh360 symbol keys, not the ambiguous part number, define identity.
                  da_component = final_by_key["DA|DOOR ALARM"][0]
                  solenoid_component = final_by_key["S|LIQUID LINE SOLENOID VALVE 120V"][0]
                  builder_export = {
                      "components": [
                          {
                              "id": da_component["id"],
                              "displayName": "STALE BUILDER DA",
                              "category": "symbols_markers",
                              "partNumber": "DA",
                              "sourcePath": da_component["sourceFile"],
                          },
                          {
                              "id": "stale-builder-generic-s",
                              "displayName": "STALE GENERIC S SYMBOL",
                              "category": "symbols_markers",
                              "partNumber": "S",
                              "sourcePath": solenoid_component["sourceFile"],
                          },
                      ]
                  }
                  (docs / "library" / "component_builder_export.json").write_text(
                      json.dumps(builder_export, indent=2),
                      encoding="utf-8",
                  )
                  loaded = LibraryV2(docs).load(include_legacy=False)
                  loaded_canonical = []
                  for component in loaded["components"]:
                      source = component.get("source")
                      key = str(source.get("standardKey") or "") if isinstance(source, dict) else ""
                      if key in EXPECTED_KEYS and not component.get("retired"):
                          loaded_canonical.append(component)
                  loaded_canonical.sort(key=lambda component: int(component.get("sortOrder") or 0))
                  assert [component["source"]["standardKey"] for component in loaded_canonical] == EXPECTED_KEYS
                  assert len([
                      component for component in loaded["components"]
                      if component.get("collection") == "Refrigeration Controls Symbols"
                      and not component.get("retired")
                  ]) == 15
                  loaded_da = next(
                      component for component in loaded_canonical
                      if component["source"]["standardKey"] == "DA|DOOR ALARM"
                  )
                  assert loaded_da["rendererVersion"] == RENDERER_VERSION
                  assert loaded_da["displayName"] == da_component["displayName"]
          '''
          if smoke.count(test_anchor) != 1:
              raise SystemExit(f'smoke test anchor count was {smoke.count(test_anchor)}, expected 1')
          smoke = smoke.replace(test_anchor, test_replacement, 1)
          compile(smoke, str(smoke_path), 'exec')
          smoke_path.write_text(smoke, encoding='utf-8')

      - name: Run focused tests before commit
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile core/library_v2.py scripts/smoke_symbol_standard_v39.py
          python -m scripts.smoke_symbol_standard_v39
          git diff --check

      - name: Commit controlled repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/library_v2.py scripts/smoke_symbol_standard_v39.py
          git commit -m 'Preserve canonical V39 symbols across builder export union'
          git push origin HEAD:repair/exact-symbol-component-library-v39-parity
