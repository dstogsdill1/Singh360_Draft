name: Apply V39 Browser Src Field Fix

on:
  pull_request:
    branches:
      - repair/current-dashboard-live-v10
    paths:
      - '.github/workflows/apply-v39-browser-src-field.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Verify the persisted Fabric image source field
        shell: python
        run: |
          from pathlib import Path

          path = Path('scripts/smoke_symbol_library_browser_v39.py')
          text = path.read_text(encoding='utf-8')
          old = 'source_urls = [str(obj.get("sourceUrl") or "") for obj in objects]'
          new = 'source_urls = [str(obj.get("sourceUrl") or obj.get("src") or "") for obj in objects]'
          if text.count(old) != 1:
              raise SystemExit(f'expected one source URL collection line, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')

      - name: Compile and push source fix
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/smoke_symbol_library_browser_v39.py
          git diff --check
          git config user.name 'Singh360 Controlled Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/smoke_symbol_library_browser_v39.py
          git commit -m 'Verify persisted Fabric src in V39 browser smoke'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
