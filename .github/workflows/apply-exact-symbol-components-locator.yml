name: Apply Exact Symbol Components Locator

on:
  pull_request:
    branches:
      - repair/current-dashboard-live-v10
    paths:
      - '.github/workflows/apply-exact-symbol-components-locator.yml'

permissions:
  contents: write

jobs:
  apply-components-locator:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Match the collapsible Components control
        shell: python
        run: |
          from pathlib import Path

          path = Path('scripts/smoke_symbol_library_browser_v39.py')
          text = path.read_text(encoding='utf-8')
          old = 'components = page.get_by_role("button", name="Components", exact=True)'
          new = 'components = page.get_by_role("button", name=re.compile(r"Components$"))'
          if text.count(old) != 1:
              raise SystemExit(f'expected one exact Components locator, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')

      - name: Compile and commit Components locator
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/smoke_symbol_library_browser_v39.py
          git diff --check
          git config user.name 'Singh360 Controlled Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/smoke_symbol_library_browser_v39.py
          git commit -m 'Match collapsible Components control in V39 browser smoke'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
